<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ridit - Author Administration</title>
  <link rel="icon" href="../images/logo.png" type="image/png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../styles/glavni.css" />
  <link rel="stylesheet" href="../styles/komponente.css" />
  <link rel="stylesheet" href="../styles/autori.css" />
  <link rel="stylesheet" href="../styles/responsive.css" />
  <link rel="stylesheet" href="../styles/navbar.css" />
</head>
<body>

  <header class="navbar">
    <div class="navbar-sadrzaj">
      <a href="../index.html" class="logo">
        <img src="../images/logo.png" alt="" class="logo-slika" width="40" height="40" decoding="async" />
        <span>Ridit</span>
      </a>
      <button class="hamburger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav-linkovi">☰</button>
      <nav>
        <ul class="nav-linkovi" id="nav-linkovi">
          <li><a href="../index.html">Books</a></li>
          <li><a href="Autori.html">Authors</a></li>
          <li><a href="profil.html">My Profile</a></li>
          <li><a href="administracijaKnjiga.html">Admin Books</a></li>
          <li><a href="administracijaAutora.html" class="aktivan">Admin Authors</a></li>
        </ul>
      </nav>
      <div class="nav-akcije" id="nav-akcije">
        <button type="button" class="dugme dugme-primarno" id="dugme-prijava">Log In</button>
        <button type="button" class="dugme dugme-primarno" id="dugme-registracija">Register</button>
      </div>
    </div>
  </header>

  <main>
    <div class="naslov-sekcije">
      <h1>Author Administration</h1>
      <button type="button" class="dugme dugme-primarno" id="dugme-novi-autor">+ New Author</button>
    </div>

    <div class="tabela-wrapper">
      <table class="tabela">
        <thead>
          <tr>
            <th>Image</th>
            <th>Full Name</th>
            <th>Status</th>
            <th>Awards</th>
            <th>Copies Sold</th>
            <th>Manager Phone</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="admin-tabela-telo">
          <tr><td colspan="7">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <p id="admin-poruka" class="sakriveno" style="margin-top:var(--razmak-m);"></p>
  </main>

  <div class="modal-pozadina" id="modal-autor-forma">
    <div class="modal modal-veliki">
      <div class="modal-zaglavlje">
        <h2 id="admin-forma-naslov">New Author</h2>
        <button type="button" class="modal-zatvori" id="modal-autor-zatvori">&times;</button>
      </div>
      <div class="modal-telo">
        <p id="admin-modal-poruka" class="sakriveno"></p>
        <form class="forma" action="#" method="get" onsubmit="return false;">
          <div class="forma-red">
            <div class="polje">
              <label for="autor-ime-input">First Name</label>
              <input type="text" id="autor-ime-input" />
            </div>
            <div class="polje">
              <label for="autor-prezime-input">Last Name</label>
              <input type="text" id="autor-prezime-input" />
            </div>
          </div>
          <div class="polje">
            <label for="autor-biografija-input">Biography</label>
            <textarea id="autor-biografija-input"></textarea>
          </div>
          <div class="polje">
            <label for="autor-slike-input">Image URLs (comma-separated)</label>
            <input type="text" id="autor-slike-input" placeholder="https://..." />
          </div>
          <div class="forma-red">
            <div class="polje">
              <label for="autor-status-input">Status</label>
              <select id="autor-status-input">
                <option value="">Select status</option>
                <option value="Active">Active</option>
                <option value="Retired">Retired</option>
                <option value="Deceased">Deceased</option>
              </select>
            </div>
            <div class="polje">
              <label for="autor-datum-input">Date of Birth</label>
              <input type="date" id="autor-datum-input" />
            </div>
          </div>
          <div class="forma-red">
            <div class="polje">
              <label for="autor-nagrade-input">Number of Awards</label>
              <input type="number" id="autor-nagrade-input" min="0" />
            </div>
            <div class="polje">
              <label for="autor-primeraka-input">Copies Sold</label>
              <input type="number" id="autor-primeraka-input" min="0" />
            </div>
          </div>
          <div class="polje">
            <label for="autor-telefon-input">Manager Phone</label>
            <input type="text" id="autor-telefon-input" placeholder="+381 64 111-2222" />
          </div>
        </form>
      </div>
      <div class="modal-podnozje">
        <button type="button" class="dugme dugme-outline" id="modal-autor-otkazi">Cancel</button>
        <button type="button" class="dugme dugme-primarno" id="dugme-sacuvaj-autor">Save</button>
      </div>
    </div>
  </div>

  <div class="modal-pozadina" id="modal-brisanje-autora">
    <div class="modal">
      <div class="modal-zaglavlje">
        <h2>Confirm Deletion</h2>
        <button type="button" class="modal-zatvori" id="modal-brisanje-zatvori">&times;</button>
      </div>
      <div class="modal-telo">
        <p id="modal-brisanje-tekst">Are you sure?</p>
      </div>
      <div class="modal-podnozje">
        <button type="button" class="dugme dugme-outline" id="modal-brisanje-otkazi">Cancel</button>
        <button type="button" class="dugme dugme-opasno" id="modal-brisanje-potvrdi">Delete</button>
      </div>
    </div>
  </div>

  <footer class="footer"><p>© 2026 <strong><a href="../index.html">Ridit</a></strong></p></footer>

  <div id="modali-kontejner"></div>

  <script src="../scripts/firebase.js"></script>
  <script src="../scripts/pomocne.js"></script>
  <script src="../scripts/navbar.js"></script>
  <script src="../scripts/modali.js"></script>
  <script src="../scripts/adminAutori.js"></script>
</body>
</html>
