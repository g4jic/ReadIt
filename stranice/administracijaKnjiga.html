<!DOCTYPE html>
<html lang="sr-Cyrl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ридит - Администрација књига</title>
  <link rel="icon" href="../slike/logo.png" type="image/png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../stilovi/glavni.css" />
  <link rel="stylesheet" href="../stilovi/komponente.css" />
  <link rel="stylesheet" href="../stilovi/knjige.css" />
  <link rel="stylesheet" href="../stilovi/responsive.css" />
  <link rel="stylesheet" href="../stilovi/navbar.css" />
</head>
<body>

  <header class="navbar">
    <div class="navbar-sadrzaj">
      <a href="../index.html" class="logo">
        <img src="../slike/logo.png" alt="" class="logo-slika" width="40" height="40" decoding="async" />
        <span>Ридит</span>
      </a>
      <button class="hamburger" type="button" aria-label="Отвори мени" aria-expanded="false" aria-controls="nav-linkovi">☰</button>
      <nav>
        <ul class="nav-linkovi" id="nav-linkovi">
          <li><a href="../index.html">Књиге</a></li>
          <li><a href="Autori.html">Аутори</a></li>
          <li><a href="profil.html">Мој профил</a></li>
          <li><a href="administracijaKnjiga.html" class="aktivan">Админ књиге</a></li>
          <li><a href="administracijaAutora.html">Админ аутори</a></li>
        </ul>
      </nav>
      <div class="nav-akcije" id="nav-akcije">
        <button type="button" class="dugme dugme-primarno" id="dugme-prijava">Пријава</button>
        <button type="button" class="dugme dugme-primarno" id="dugme-registracija">Регистрација</button>
      </div>
    </div>
  </header>

  <main>
    <div class="naslov-sekcije">
      <h1>Администрација књига</h1>
      <button type="button" class="dugme dugme-primarno" id="dugme-nova-knjiga">+ Нова књига</button>
    </div>

    <div class="tabela-wrapper">
      <table class="tabela">
        <thead>
          <tr>
            <th>Слика</th>
            <th>Назив</th>
            <th>Аутор</th>
            <th>Жанр</th>
            <th>Стр.</th>
            <th>Цена</th>
            <th>ISBN</th>
            <th>Акције</th>
          </tr>
        </thead>
        <tbody id="admin-tabela-telo">
          <tr><td colspan="8">Учитавање...</td></tr>
        </tbody>
      </table>
    </div>

    <p id="admin-poruka" class="sakriveno" style="margin-top:var(--razmak-m);"></p>
  </main>

  <div class="modal-pozadina" id="modal-knjiga-forma">
    <div class="modal modal-veliki">
      <div class="modal-zaglavlje">
        <h2 id="admin-forma-naslov">Нова књига</h2>
        <button type="button" class="modal-zatvori" id="modal-knjiga-zatvori">&times;</button>
      </div>
      <div class="modal-telo">
        <p id="admin-modal-poruka" class="sakriveno"></p>
        <form class="forma" action="#" method="get" onsubmit="return false;">
          <div class="polje">
            <label for="knjiga-naziv-input">Назив</label>
            <input type="text" id="knjiga-naziv-input" />
          </div>
          <div class="polje">
            <label for="knjiga-opis-input">Опис</label>
            <textarea id="knjiga-opis-input"></textarea>
          </div>
          <div class="polje">
            <label for="knjiga-slike-input">URL-ови слика (одвојени зarezom)</label>
            <input type="text" id="knjiga-slike-input" placeholder="https://..." />
          </div>
          <div class="forma-red">
            <div class="polje">
              <label for="knjiga-zanr-input">Жанр</label>
              <input type="text" id="knjiga-zanr-input" />
            </div>
            <div class="polje">
              <label for="knjiga-format-input">Формат</label>
              <select id="knjiga-format-input">
                <option>Тврди повез</option>
                <option>Меки повез</option>
              </select>
            </div>
          </div>
          <div class="forma-red">
            <div class="polje">
              <label for="knjiga-cena-input">Цена</label>
              <input type="number" id="knjiga-cena-input" min="0" />
            </div>
            <div class="polje">
              <label for="knjiga-strana-input">Број страна</label>
              <input type="number" id="knjiga-strana-input" min="1" />
            </div>
          </div>
          <div class="polje">
            <label for="knjiga-autor-input">Аутор</label>
            <select id="knjiga-autor-input"></select>
          </div>
          <div class="polje">
            <label for="knjiga-isbn-input">ISBN</label>
            <input type="text" id="knjiga-isbn-input" placeholder="978-..." />
          </div>
        </form>
      </div>
      <div class="modal-podnozje">
        <button type="button" class="dugme dugme-outline" id="modal-knjiga-otkazi">Откажи</button>
        <button type="button" class="dugme dugme-primarno" id="dugme-sacuvaj-knjiga">Сачувај</button>
      </div>
    </div>
  </div>

  <div class="modal-pozadina" id="modal-brisanje-knjige">
    <div class="modal">
      <div class="modal-zaglavlje">
        <h2>Потврда брисања</h2>
        <button type="button" class="modal-zatvori" id="modal-brisanje-zatvori">&times;</button>
      </div>
      <div class="modal-telo">
        <p id="modal-brisanje-tekst">Да ли сте сигурни?</p>
      </div>
      <div class="modal-podnozje">
        <button type="button" class="dugme dugme-outline" id="modal-brisanje-otkazi">Откажи</button>
        <button type="button" class="dugme dugme-opasno" id="modal-brisanje-potvrdi">Обриши</button>
      </div>
    </div>
  </div>

  <footer class="footer"><p>© 2026 <strong><a href="../index.html">Ридит</a></strong></p></footer>

  <div id="modali-kontejner"></div>

  <script src="../skripte/firebase.js"></script>
  <script src="../skripte/pomocne.js"></script>
  <script src="../skripte/navbar.js"></script>
  <script src="../skripte/modali.js"></script>
  <script src="../skripte/adminKnjige.js"></script>
</body>
</html>
