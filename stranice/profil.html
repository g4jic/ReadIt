<!DOCTYPE html>
<html lang="sr-Cyrl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ридит - Мој профил</title>
  <link rel="icon" href="../slike/logo.png" type="image/png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../stilovi/glavni.css" />
  <link rel="stylesheet" href="../stilovi/komponente.css" />
  <link rel="stylesheet" href="../stilovi/profil.css" />
  <link rel="stylesheet" href="../stilovi/autori.css" />
  <link rel="stylesheet" href="../stilovi/responsive.css" />
  <link rel="stylesheet" href="../stilovi/navbar.css" />
</head>
<body>

  <header class="navbar">
    <div class="navbar-sadrzaj">
      <a href="../index.html" class="logo">
        <img src="../slike/logo.png" alt="" class="logo-slika" width="40" height="40" decoding="async" />
        <span>Ридит</span>
      </a>
      <button class="hamburger" type="button" aria-label="Отвори мени" aria-expanded="false" aria-controls="nav-linkovi">☰</button>
      <nav>
        <ul class="nav-linkovi" id="nav-linkovi">
          <li><a href="../index.html">Књиге</a></li>
          <li><a href="Autori.html">Аутори</a></li>
          <li><a href="profil.html" class="aktivan">Мој профил</a></li>
          <li><a href="administracijaKnjiga.html">Админ књиге</a></li>
          <li><a href="administracijaAutora.html">Админ аутори</a></li>
        </ul>
      </nav>
      <div class="nav-akcije" id="nav-akcije">
        <button type="button" class="dugme dugme-primarno" id="dugme-prijava">Пријава</button>
        <button type="button" class="dugme dugme-primarno" id="dugme-registracija">Регистрација</button>
      </div>
    </div>
  </header>

  <main>
    <div class="naslov-sekcije">
      <h1>Мој профил</h1>
    </div>

    <section class="profil-karta profil-karta-podaci" aria-label="Подаци о кориснику" id="profil-osnovni-podaci">
      <p class="poruka-prazno">Учитавање профила...</p>
    </section>

    <section class="profil-karta profil-karta-stub" aria-label="Рецензије" id="moje-recenzije-kontejner">
      <p class="poruka-prazno">Учитавање рецензија...</p>
    </section>

    <section class="profil-karta profil-karta-stub" aria-label="Оцене аутора" id="moje-ocene-kontejner">
      <p class="poruka-prazno">Учитавање оцена...</p>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 <strong><a href="../index.html">Ридит</a></strong></p>
  </footer>

  <div class="modal-pozadina" id="modal-brisanje-profil">
    <div class="modal">
      <div class="modal-zaglavlje">
        <h2>Потврда брисања</h2>
        <button type="button" class="modal-zatvori" id="modal-brisanje-profil-zatvori">&times;</button>
      </div>
      <div class="modal-telo">
        <p id="modal-brisanje-profil-tekst">Да ли сте сигурни?</p>
        <p id="modal-brisanje-profil-greska" class="poruka-greska sakriveno" style="margin-top:var(--razmak-m);"></p>
      </div>
      <div class="modal-podnozje">
        <button type="button" class="dugme dugme-outline" id="modal-brisanje-profil-otkazi">Откажи</button>
        <button type="button" class="dugme dugme-opasno" id="modal-brisanje-profil-potvrdi">Обриши</button>
      </div>
    </div>
  </div>

  <div id="modali-kontejner"></div>

  <script src="../skripte/firebase.js"></script>
  <script src="../skripte/pomocne.js"></script>
  <script src="../skripte/navbar.js"></script>
  <script src="../skripte/modali.js"></script>
  <script src="../skripte/profil.js"></script>
