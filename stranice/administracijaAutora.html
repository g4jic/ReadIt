<!DOCTYPE html>
<html lang="sr-Cyrl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ридит - Администрација аутора</title>
  <link rel="icon" href="../slike/logo.png" type="image/png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../stilovi/glavni.css" />
  <link rel="stylesheet" href="../stilovi/komponente.css" />
  <link rel="stylesheet" href="../stilovi/autori.css" />
  <link rel="stylesheet" href="../stilovi/responsive.css" />
  <link rel="stylesheet" href="../stilovi/navbar.css" />
</head>
<body>

  <header class="navbar">
    <div class="navbar-sadrzaj">
      <a href="../index.html" class="logo">
        <img src="../slike/logo.png" alt="" class="logo-slika" width="40" height="40" decoding="async" />
        <span>Ридит</span>
      </a>
      <button class="hamburger" type="button" aria-label="Отвори мени" aria-expanded="false" aria-controls="nav-linkovi">☰</button>
      <nav>
        <ul class="nav-linkovi" id="nav-linkovi">
          <li><a href="../index.html">Књиге</a></li>
          <li><a href="Autori.html">Аутори</a></li>
          <li><a href="profil.html">Мој профил</a></li>
          <li><a href="administracijaKnjiga.html">Админ књиге</a></li>
          <li><a href="administracijaAutora.html" class="aktivan">Админ аутори</a></li>
        </ul>
      </nav>
      <div class="nav-akcije" id="nav-akcije">
        <button type="button" class="dugme dugme-primarno" id="dugme-prijava">Пријава</button>
        <button type="button" class="dugme dugme-primarno" id="dugme-registracija">Регистрација</button>
      </div>
    </div>
  </header>

  <main>
    <div class="naslov-sekcije">
      <h1>Администрација аутора</h1>
      <button type="button" class="dugme dugme-primarno" id="dugme-novi-autor">+ Нови аутор</button>
    </div>

    <div class="tabela-wrapper">
      <table class="tabela">
        <thead>
          <tr>
            <th>Слика</th>
            <th>Име и презиме</th>
            <th>Статус</th>
            <th>Награде</th>
            <th>Продати прим.</th>
            <th>Телефон менаџера</th>
            <th>Акције</th>
          </tr>
        </thead>
        <tbody id="admin-tabela-telo">
          <tr><td colspan="7">Учитавање...</td></tr>
        </tbody>
      </table>
    </div>

    <p id="admin-poruka" class="sakriveno" style="margin-top:var(--razmak-m);"></p>
  </main>

  <div class="modal-pozadina" id="modal-autor-forma">
    <div class="modal modal-veliki">
      <div class="modal-zaglavlje">
        <h2 id="admin-forma-naslov">Нови аутор</h2>
        <button type="button" class="modal-zatvori" id="modal-autor-zatvori">&times;</button>
      </div>
      <div class="modal-telo">
        <p id="admin-modal-poruka" class="sakriveno"></p>
        <form class="forma" action="#" method="get" onsubmit="return false;">
          <div class="forma-red">
            <div class="polje">
              <label for="autor-ime-input">Име</label>
              <input type="text" id="autor-ime-input" />
            </div>
            <div class="polje">
              <label for="autor-prezime-input">Презиме</label>
              <input type="text" id="autor-prezime-input" />
            </div>
          </div>
          <div class="polje">
            <label for="autor-biografija-input">Биографија</label>
            <textarea id="autor-biografija-input"></textarea>
          </div>
          <div class="polje">
            <label for="autor-slike-input">URL-ови слика (одвојени зarezom)</label>
            <input type="text" id="autor-slike-input" placeholder="https://..." />
          </div>
          <div class="forma-red">
            <div class="polje">
              <label for="autor-status-input">Статус</label>
              <select id="autor-status-input">
                <option value="">Изаберите статус</option>
                <option value="Активан">Активан</option>
                <option value="У пензији">У пензији</option>
                <option value="Преминуо">Преминуо</option>
              </select>
            </div>
            <div class="polje">
              <label for="autor-datum-input">Датум рођења</label>
              <input type="date" id="autor-datum-input" />
            </div>
          </div>
          <div class="forma-red">
            <div class="polje">
              <label for="autor-nagrade-input">Број награда</label>
              <input type="number" id="autor-nagrade-input" min="0" />
            </div>
            <div class="polje">
              <label for="autor-primeraka-input">Продати примерци</label>
              <input type="number" id="autor-primeraka-input" min="0" />
            </div>
          </div>
          <div class="polje">
            <label for="autor-telefon-input">Телефон менаџера</label>
            <input type="text" id="autor-telefon-input" placeholder="+381 64 111-2222" />
          </div>
        </form>
      </div>
      <div class="modal-podnozje">
        <button type="button" class="dugme dugme-outline" id="modal-autor-otkazi">Откажи</button>
        <button type="button" class="dugme dugme-primarno" id="dugme-sacuvaj-autor">Сачувај</button>
      </div>
    </div>
  </div>

  <div class="modal-pozadina" id="modal-brisanje-autora">
    <div class="modal">
      <div class="modal-zaglavlje">
        <h2>Потврда брисања</h2>
        <button type="button" class="modal-zatvori" id="modal-brisanje-zatvori">&times;</button>
      </div>
      <div class="modal-telo">
        <p id="modal-brisanje-tekst">Да ли сте сигурни?</p>
      </div>
      <div class="modal-podnozje">
        <button type="button" class="dugme dugme-outline" id="modal-brisanje-otkazi">Откажи</button>
        <button type="button" class="dugme dugme-opasno" id="modal-brisanje-potvrdi">Обриши</button>
      </div>
    </div>
  </div>

  <footer class="footer"><p>© 2026 <strong><a href="../index.html">Ридит</a></strong></p></footer>

  <div id="modali-kontejner"></div>

  <script src="../skripte/firebase.js"></script>
  <script src="../skripte/pomocne.js"></script>
  <script src="../skripte/navbar.js"></script>
  <script src="../skripte/modali.js"></script>
  <script src="../skripte/adminAutori.js"></script>
</body>
</html>
