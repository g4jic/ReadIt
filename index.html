<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ridit - Book Catalog</title>
  <link rel="icon" href="images/logo.png" type="image/png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles/glavni.css" />
  <link rel="stylesheet" href="styles/komponente.css" />
  <link rel="stylesheet" href="styles/knjige.css" />
  <link rel="stylesheet" href="styles/responsive.css" />
  <link rel="stylesheet" href="styles/navbar.css" />
</head>
<body>

  <header class="navbar">
    <div class="navbar-sadrzaj">
      <a href="index.html" class="logo">
        <img src="images/logo.png" alt="" class="logo-slika" width="40" height="40" decoding="async" />
        <span>Ridit</span>
      </a>
      <button class="hamburger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav-linkovi">☰</button>
      <nav>
        <ul class="nav-linkovi" id="nav-linkovi">
          <li><a href="index.html" class="aktivan">Books</a></li>
          <li><a href="pages/Autori.html">Authors</a></li>
          <li><a href="pages/profil.html">My Profile</a></li>
          <li><a href="pages/administracijaKnjiga.html">Admin Books</a></li>
          <li><a href="pages/administracijaAutora.html">Admin Authors</a></li>
        </ul>
      </nav>
      <div class="nav-akcije" id="nav-akcije">
        <button type="button" class="dugme dugme-primarno" id="dugme-prijava">Log In</button>
        <button type="button" class="dugme dugme-primarno" id="dugme-registracija">Register</button>
      </div>
    </div>
  </header>

  <main>
    <div class="naslov-sekcije">
      <h1>Book Catalog</h1>
    </div>

    <div class="pretraga-traka">
      <input type="text" id="pretraga-naziv" placeholder="Search by title..." aria-label="Search by title" />
      <select id="pretraga-zanr" aria-label="Genre">
        <option value="">All genres</option>
      </select>
      <button type="button" class="dugme dugme-primarno" id="dugme-pretrazi-knjige">Search</button>
      <button type="button" class="dugme dugme-outline" id="dugme-resetuj-knjige">Reset</button>
    </div>

    <div class="mreza-knjiga" id="katalog-kontejner">
      <p class="poruka-prazno">Loading books...</p>
    </div>
  </main>

  <footer class="footer">
    <p>© 2026 <strong><a href="index.html">Ridit</a></strong></p>
  </footer>

  <div id="modali-kontejner"></div>

  <script src="scripts/firebase.js"></script>
  <script src="scripts/pomocne.js"></script>
  <script src="scripts/navbar.js"></script>
  <script src="scripts/modali.js"></script>
  <script src="scripts/knjige.js"></script>
</body>
</html>
