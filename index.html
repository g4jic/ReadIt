<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ridit - Book Catalog</title>
  <link rel="icon" href="images/logo.png" type="image/png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/books.css" />
  <link rel="stylesheet" href="styles/responsive.css" />
  <link rel="stylesheet" href="styles/navbar.css" />
</head>
<body>

  <header class="navbar">
    <div class="navbar-content">
      <a href="index.html" class="logo">
        <img src="images/logo.png" alt="" class="logo-image" width="40" height="40" decoding="async" />
        <span>Ridit</span>
      </a>
      <button class="hamburger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav-links">☰</button>
      <nav>
        <ul class="nav-links" id="nav-links">
          <li><a href="index.html" class="active">Books</a></li>
          <li><a href="pages/authors.html">Authors</a></li>
          <li><a href="pages/profile.html">My Profile</a></li>
          <li><a href="pages/admin-books.html">Admin Books</a></li>
          <li><a href="pages/admin-authors.html">Admin Authors</a></li>
        </ul>
      </nav>
      <div class="nav-actions" id="nav-actions">
        <button type="button" class="btn btn-primary" id="btn-login">Log In</button>
        <button type="button" class="btn btn-primary" id="btn-register">Register</button>
      </div>
    </div>
  </header>

  <main>
    <div class="section-header">
      <h1>Book Catalog</h1>
    </div>

    <div class="search-bar">
      <input type="text" id="search-title" placeholder="Search by title..." aria-label="Search by title" />
      <select id="search-genre" aria-label="Genre">
        <option value="">All genres</option>
      </select>
      <button type="button" class="btn btn-primary" id="btn-search-books">Search</button>
      <button type="button" class="btn btn-outline" id="btn-reset-books">Reset</button>
    </div>

    <div class="books-grid" id="catalog-container">
      <p class="message-empty">Loading books...</p>
    </div>
  </main>

  <footer class="footer">
    <p>© 2026 <strong><a href="index.html">Ridit</a></strong></p>
  </footer>

  <div id="modals-container"></div>

  <script src="scripts/firebase.js"></script>
  <script src="scripts/helpers.js"></script>
  <script src="scripts/navbar.js"></script>
  <script src="scripts/modals.js"></script>
  <script src="scripts/books.js"></script>
</body>
</html>
